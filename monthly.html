<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Monthly Attendance</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

.container {
    max-width: 1600px;
    margin: auto;
    padding: 20px;
}

header {
    background: #1f4e78;
    color: white;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 20px;
}

header h1 {
    margin: 0 0 5px;
}

header p {
    margin: 0;
}

.card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.controls {
    display: flex;
    gap: 12px;
    align-items: end;
    flex-wrap: wrap;
}

.control {
    min-width: 200px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
}

input,
button {
    padding: 11px;
    border-radius: 7px;
    border: 1px solid #ccc;
    font-size: 15px;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.back {
    background: #6c757d;
    color: white;
}

.download {
    background: #198754;
    color: white;
}

.table-wrapper {
    overflow-x: auto;
    width: 100%;
}

table {
    border-collapse: separate;
    border-spacing: 0;
    width: max-content;
    min-width: 100%;
}

th,
td {
    border-right: 1px solid #ddd;
    border-bottom: 1px solid #ddd;
    padding: 9px 10px;
    text-align: center;
    white-space: nowrap;
    min-width: 82px;
}

th {
    background: #1f4e78;
    color: white;
    position: sticky;
    top: 0;
    z-index: 5;
}

.employee-column {
    position: sticky;
    left: 0;
    z-index: 6;
    min-width: 180px;
    text-align: left;
    background: white;
}

th.employee-column {
    background: #1f4e78;
    color: white;
}

.summary-column {
    font-weight: bold;
    background: white;
}

th.summary-column {
    background: #1f4e78;
}

.present {
    color: #198754;
    font-weight: bold;
}

.leave {
    color: #dc3545;
    font-weight: bold;
}

.weekoff {
    color: #e67e22;
    font-weight: bold;
}

.not-marked {
    color: #777;
}

.summary-boxes {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.summary-box {
    background: #eef5fb;
    border-left: 5px solid #1f4e78;
    padding: 15px;
    border-radius: 8px;
}

.summary-box h3 {
    margin: 0 0 7px;
    font-size: 14px;
    color: #555;
}

.summary-box p {
    margin: 0;
    font-size: 22px;
    font-weight: bold;
    color: #1f4e78;
}

.legend {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 15px;
    font-size: 14px;
}

.error {
    background: #f8d7da;
    color: #842029;
    padding: 12px;
    border-radius: 7px;
    margin-top: 15px;
    display: none;
}

@media(max-width:700px) {

    .container {
        padding: 10px;
    }

    .summary-boxes {
        grid-template-columns: 1fr 1fr;
    }

    .employee-column {
        min-width: 150px;
    }

}

</style>

</head>


<body>


<div class="container">


<header>

<h1>Monthly Attendance</h1>

<p>
Team attendance, leave and working hours
</p>

</header>


<div class="card">


<div class="controls">


<div class="control">

<label>Select Month</label>

<input
    type="month"
    id="monthFilter"
>

</div>


<button
    class="back"
    onclick="goBack()"
>
← Attendance Entry
</button>


<button
    class="download"
    onclick="downloadCSV()"
>
Download Report
</button>


</div>


<div
    id="errorMessage"
    class="error"
></div>


<div class="legend">

<span>🟢 Present</span>

<span>🔴 Leave</span>

<span>🟠 Weekly Off</span>

<span>⚪ Not Marked</span>

</div>

</div>


<div class="card">


<div class="summary-boxes">


<div class="summary-box">

<h3>Total Employees</h3>

<p id="totalEmployees">0</p>

</div>


<div class="summary-box">

<h3>Total Present</h3>

<p id="totalPresent">0</p>

</div>


<div class="summary-box">

<h3>Total Leave</h3>

<p id="totalLeave">0</p>

</div>


<div class="summary-box">

<h3>Total Team Hours</h3>

<p id="totalHours">0h 00m</p>

</div>


</div>

</div>


<div class="card">


<div class="table-wrapper">


<table id="attendanceTable">


<thead id="tableHead">
</thead>


<tbody id="tableBody">
</tbody>


</table>


</div>


</div>


</div>


<script>


/*
==========================================
SUPABASE CONFIGURATION
==========================================
*/

const SUPABASE_URL =
"https://ifvhwjufwnonfmkeapls.supabase.co";


const SUPABASE_KEY =
"sb_publishable_Uvg5V3wAptklWEH5ZuYCQg_bk9hiYVa";


/*
==========================================
GLOBAL DATA
==========================================
*/

let employees = [];

let attendanceData = [];


/*
==========================================
SUPABASE REQUEST
==========================================
*/

async function supabaseRequest(
    endpoint,
    options = {}
) {

    const response =
        await fetch(
            SUPABASE_URL + endpoint,
            {
                ...options,

                headers: {

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json"

                }

            }
        );


    if (!response.ok) {

        const error =
            await response.text();

        throw new Error(error);

    }


    if (response.status === 204) {

        return [];

    }


    return response.json();

}


/*
==========================================
LOAD EMPLOYEES
==========================================
*/

async function loadEmployees() {

    employees =
        await supabaseRequest(
            "/rest/v1/employees" +
            "?select=id,employee_name" +
            "&active=eq.true" +
            "&order=employee_name"
        );

}


/*
==========================================
LOAD ATTENDANCE
==========================================
*/

async function loadAttendance() {

    attendanceData =
        await supabaseRequest(
            "/rest/v1/attendance" +
            "?select=*"
        );

}


/*
==========================================
FORMAT HOURS
==========================================
*/

function formatHours(decimalHours) {

    const totalMinutes =
        Math.round(
            Number(decimalHours || 0) * 60
        );

    const hours =
        Math.floor(
            totalMinutes / 60
        );

    const minutes =
        totalMinutes % 60;

    return (
        hours +
        "h " +
        String(minutes).padStart(2, "0") +
        "m"
    );

}


/*
==========================================
SELECTED MONTH
==========================================
*/

function getSelectedMonth() {

    return document
        .getElementById("monthFilter")
        .value;

}


/*
==========================================
NUMBER OF DAYS TO DISPLAY
==========================================
*/

function getDaysToDisplay(
    year,
    month
) {

    const today = new Date();

    const currentYear =
        today.getFullYear();

    const currentMonth =
        today.getMonth() + 1;

    const daysInMonth =
        new Date(
            year,
            month,
            0
        ).getDate();

    if (
        year === currentYear &&
        month === currentMonth
    ) {

        return today.getDate();

    }

    return daysInMonth;

}


/*
==========================================
FIND ATTENDANCE
==========================================
*/

function findAttendance(
    employeeId,
    date
) {

    return attendanceData.find(
        record => {

            const sameEmployee =
                Number(
                    record.employee_id
                ) ===
                Number(employeeId);

            const sameDate =
                record.attendance_date ===
                date;

            return (
                sameEmployee &&
                sameDate
            );

        }
    );

}


/*
==========================================
RENDER MONTHLY TABLE
==========================================
*/

function renderTable() {

    const selectedMonth =
        getSelectedMonth();

    if (!selectedMonth) return;


    const parts =
        selectedMonth.split("-");

    const year =
        Number(parts[0]);

    const month =
        Number(parts[1]);


    const days =
        getDaysToDisplay(
            year,
            month
        );


    /*
    HEADER
    */

    let headerHTML = `

        <tr>

            <th
                class="employee-column"
            >
                Employee
            </th>

    `;


    for (
        let day = 1;
        day <= days;
        day++
    ) {

        const date =
            new Date(
                year,
                month - 1,
                day
            );

        const dayName =
            date.toLocaleDateString(
                "en-IN",
                {
                    weekday: "short"
                }
            );

        const monthName =
            date.toLocaleDateString(
                "en-IN",
                {
                    month: "short"
                }
            );


        headerHTML += `

            <th>

                ${String(day)
                    .padStart(2, "0")}

                ${monthName}

                <br>

                <small>
                    ${dayName}
                </small>

            </th>

        `;

    }


   /*
SUMMARY HEADERS
*/

headerHTML += `

    <th class="summary-column">
        Present
    </th>

    <th class="summary-column">
        Leave
    </th>

</tr>

`;

    document.getElementById(
        "tableHead"
    ).innerHTML =
        headerHTML;


    /*
    BODY
    */

    let bodyHTML = "";


    let teamPresent = 0;

    let teamLeave = 0;

    let teamHours = 0;


    employees.forEach(
        employee => {


            let presentDays = 0;

            let leaveDays = 0;

            let totalHours = 0;


            bodyHTML += `

                <tr>

                    <td
                        class="employee-column"
                    >

                        ${employee.employee_name}

                    </td>

            `;


            for (
                let day = 1;
                day <= days;
                day++
            ) {


                const date =
                    `${year}-${String(
                        month
                    ).padStart(2, "0")}-${String(
                        day
                    ).padStart(2, "0")}`;


                const record =
                    findAttendance(
                        employee.id,
                        date
                    );


                if (
                    record &&
                    record.attendance_status ===
                    "Leave"
                ) {

                    leaveDays++;

                    teamLeave++;


                    bodyHTML += `

                        <td
                            class="leave"
                        >

                            🔴 Leave

                        </td>

                    `;

                }


                else if (
                    record &&
                    record.attendance_status ===
                    "Weekly Off"
                ) {


                    bodyHTML += `

                        <td
                            class="weekoff"
                        >

                            🟠 Off

                        </td>

                    `;

                }


                else if (record) {


                    const hours =
                        Number(
                            record.hours_completed
                        ) || 0;


                    presentDays++;

                    teamPresent++;


                    totalHours +=
                        hours;

                    teamHours +=
                        hours;


                    bodyHTML += `

                        <td
                            class="present"
                        >

                            🟢
                            ${formatHours(hours)}

                        </td>

                    `;

                }


                else {


                    bodyHTML += `

                        <td
                            class="not-marked"
                        >

                            ⚪ —

                        </td>

                    `;

                }

            }


/*
SUMMARY COLUMNS
*/

bodyHTML += `

    <td class="summary-column">

        <strong>
            ${presentDays}
        </strong>

    </td>

    <td class="summary-column">

        <strong>
            ${leaveDays}
        </strong>

    </td>

    </tr>

`;


                <td
                    class="summary-column"
                    style="right:0;"
                >

                    <strong>
                        ${formatHours(
                            totalHours
                        )}
                    </strong>

                </td>


                </tr>

            `;

        }
    );


    document.getElementById(
        "tableBody"
    ).innerHTML =
        bodyHTML;


    /*
    SUMMARY
    */

    document.getElementById(
        "totalEmployees"
    ).textContent =
        employees.length;


    document.getElementById(
        "totalPresent"
    ).textContent =
        teamPresent;


    document.getElementById(
        "totalLeave"
    ).textContent =
        teamLeave;


    document.getElementById(
        "totalHours"
    ).textContent =
        formatHours(teamHours);

}


/*
==========================================
DOWNLOAD CSV
==========================================
*/

function downloadCSV() {

    const table =
        document.getElementById(
            "attendanceTable"
        );


    const rows =
        table.querySelectorAll(
            "tr"
        );


    let csv = "";


    rows.forEach(row => {

        const cells =
            row.querySelectorAll(
                "th, td"
            );


        const rowData = [];


        cells.forEach(cell => {

            rowData.push(
                '"' +
                cell.innerText
                    .replace(/"/g, '""') +
                '"'
            );

        });


        csv +=
            rowData.join(",") +
            "\n";

    });


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        "Attendance-" +
        getSelectedMonth() +
        ".csv";


    link.click();


    URL.revokeObjectURL(url);

}


/*
==========================================
BACK
==========================================
*/

function goBack() {

    window.location.href =
        "index.html";

}


/*
==========================================
INITIALIZE
==========================================
*/

async function initialize() {

    const today =
        new Date();


    document.getElementById(
        "monthFilter"
    ).value =

        today.getFullYear() +
        "-" +
        String(
            today.getMonth() + 1
        ).padStart(2, "0");


    try {

        await loadEmployees();

        await loadAttendance();

        renderTable();

    }

    catch (error) {

        const errorBox =
            document.getElementById(
                "errorMessage"
            );

        errorBox.textContent =
            "Unable to load attendance: " +
            error.message;

        errorBox.style.display =
            "block";

    }

}


/*
==========================================
MONTH CHANGE
==========================================
*/

document
    .getElementById("monthFilter")
    .addEventListener(
        "change",
        renderTable
    );


initialize();


</script>

</body>

</html>
