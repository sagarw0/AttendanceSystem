<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Attendance</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    color:#222;
}

.container{
    max-width:500px;
    margin:auto;
    padding:15px;
}

header{
    background:#1f4e78;
    color:#fff;
    padding:24px 18px;
    border-radius:14px;
    margin-bottom:18px;
    text-align:center;
}

header h1{
    margin:0 0 7px;
    font-size:30px;
}

header p{
    margin:0;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:22px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    text-transform:uppercase;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
}

button:disabled{
    cursor:not-allowed;
    opacity:.55;
}

.login-btn{
    background:#198754;
    color:#fff;
}

.logout-btn{
    background:#dc3545;
    color:#fff;
}

.employee-name{
    text-align:center;
    font-size:23px;
    font-weight:bold;
    color:#1f4e78;
    margin-bottom:20px;
}

.status{
    text-align:center;
    padding:16px;
    border-radius:10px;
    margin-bottom:13px;
    background:#eef5fb;
}

.status-label{
    font-size:13px;
    color:#666;
}

.status-value{
    font-size:23px;
    font-weight:bold;
    margin-top:5px;
    color:#1f4e78;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
    word-break:break-word;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

.info{
    background:#cff4fc;
    color:#055160;
}

.hidden{
    display:none;
}

.small{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Employee Attendance</h1>
    <p>Login and logout to record your attendance</p>
</header>

<!-- LOGIN CARD -->
<div class="card" id="loginCard">

    <label for="employeeCode">Employee Code</label>

    <input
        type="text"
        id="employeeCode"
        placeholder="Enter employee code"
        autocomplete="off"
        maxlength="50"
    >

    <button
        id="loginButton"
        class="login-btn"
        type="button"
        onclick="employeeLogin()"
    >
        🟢 LOGIN
    </button>

    <div id="loginMessage" class="message"></div>

</div>


<!-- ATTENDANCE CARD -->
<div class="card hidden" id="attendanceCard">

    <div id="employeeName" class="employee-name"></div>

    <div class="status">
        <div class="status-label">Today's Login</div>
        <div id="loginTime" class="status-value">--</div>
    </div>

    <div class="status">
        <div class="status-label">Today's Logout</div>
        <div id="logoutTime" class="status-value">--</div>
    </div>

    <div class="status">
        <div class="status-label">Hours Completed</div>
        <div id="hoursCompleted" class="status-value">--</div>
    </div>

    <button
        id="logoutButton"
        class="logout-btn"
        type="button"
        onclick="employeeLogout()"
    >
        🔴 LOGOUT
    </button>

    <div id="attendanceMessage" class="message"></div>

    <div class="small">
        Your attendance is recorded automatically.
    </div>

</div>

</div>


<script>

/* ==========================================
   SUPABASE CONFIGURATION
   ========================================== */

const SUPABASE_URL =
    "https://ifvhwjufwnonfmkeapls.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Uvg5V3wAptklWEH5ZuYCQg_bk9hiYVa";


/* ==========================================
   GLOBAL DATA
   ========================================== */

let currentEmployee = null;
let todayAttendance = null;


/* ==========================================
   SUPABASE REQUEST
   ========================================== */

async function supabaseRequest(
    endpoint,
    options = {}
) {

    const response =
        await fetch(
            SUPABASE_URL + endpoint,
            {
                ...options,

                headers: {
                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        "Bearer " +
                        SUPABASE_KEY,

                    "Content-Type":
                        "application/json",

                    "Prefer":
                        "return=representation",

                    ...(options.headers || {})
                }
            }
        );


    if (!response.ok) {

        const error =
            await response.text();

        throw new Error(
            error || "Supabase request failed"
        );

    }


    if (response.status === 204) {
        return [];
    }


    return response.json();
}


/* ==========================================
   TODAY'S DATE
   ========================================== */

function getToday() {

    const now = new Date();

    return (
        now.getFullYear() +
        "-" +
        String(
            now.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            now.getDate()
        ).padStart(2, "0")
    );
}


/* ==========================================
   CURRENT TIME
   ========================================== */

function getCurrentTime() {

    const now = new Date();

    return (
        String(
            now.getHours()
        ).padStart(2, "0") +
        ":" +
        String(
            now.getMinutes()
        ).padStart(2, "0") +
        ":00"
    );
}


/* ==========================================
   DISPLAY TIME
   ========================================== */

function formatTime(time) {

    if (!time) {
        return "--";
    }

    const parts =
        String(time).split(":");

    let hour =
        Number(parts[0]);

    const minute =
        parts[1] || "00";

    const period =
        hour >= 12
            ? "PM"
            : "AM";

    hour =
        hour % 12 || 12;

    return (
        hour +
        ":" +
        minute +
        " " +
        period
    );
}


/* ==========================================
   CALCULATE HOURS
   ========================================== */

function calculateHours(
    inTime,
    outTime
) {

    if (!inTime || !outTime) {
        return 0;
    }

    const start =
        new Date(
            "2000-01-01T" +
            inTime
        );

    let end =
        new Date(
            "2000-01-01T" +
            outTime
        );

    if (end < start) {
        end.setDate(
            end.getDate() + 1
        );
    }

    return (
        end - start
    ) / 3600000;
}


/* ==========================================
   FORMAT HOURS
   ========================================== */

function formatHours(hours) {

    const totalMinutes =
        Math.round(
            Number(hours || 0) * 60
        );

    const h =
        Math.floor(
            totalMinutes / 60
        );

    const m =
        totalMinutes % 60;

    return (
        h +
        "h " +
        String(m).padStart(2, "0") +
        "m"
    );
}


/* ==========================================
   MESSAGES
   ========================================== */

function showMessage(
    elementId,
    text,
    type = "error"
) {

    const box =
        document.getElementById(
            elementId
        );

    box.textContent =
        text;

    box.className =
        "message " + type;

    box.style.display =
        "block";
}


function clearMessage(elementId) {

    const box =
        document.getElementById(
            elementId
        );

    box.textContent = "";

    box.style.display =
        "none";
}


/* ==========================================
   BUTTON STATE
   ========================================== */

function setLoginButton(
    disabled,
    text
) {

    const button =
        document.getElementById(
            "loginButton"
        );

    button.disabled =
        disabled;

    button.textContent =
        text;
}


function setLogoutButton(
    disabled,
    text
) {

    const button =
        document.getElementById(
            "logoutButton"
        );

    button.disabled =
        disabled;

    button.textContent =
        text;
}


/* ==========================================
   FIND EMPLOYEE
   ========================================== */

async function findEmployee(
    employeeCode
) {

    return await supabaseRequest(
        "/rest/v1/employees" +
        "?employee_code=eq." +
        encodeURIComponent(
            employeeCode
        ) +
        "&active=eq.true" +
        "&select=id,employee_code,employee_name,department,designation" +
        "&limit=1"
    );
}


/* ==========================================
   LOAD TODAY'S ATTENDANCE
   ========================================== */

async function loadTodayAttendance() {

    const today =
        getToday();

    const result =
        await supabaseRequest(
            "/rest/v1/attendance" +
            "?employee_id=eq." +
            encodeURIComponent(
                currentEmployee.id
            ) +
            "&attendance_date=eq." +
            encodeURIComponent(
                today
            ) +
            "&select=*" +
            "&order=id.desc" +
            "&limit=1"
        );

    todayAttendance =
        result.length > 0
            ? result[0]
            : null;

    return todayAttendance;
}


/* ==========================================
   CREATE NEW LOGIN RECORD
   ========================================== */

async function createLoginAttendance() {

    const payload = {

        employee_id:
            currentEmployee.id,

        employee_name:
            currentEmployee.employee_name,

        attendance_date:
            getToday(),

        in_time:
            getCurrentTime(),

        out_time:
            null,

        hours_completed:
            0,

        attendance_status:
            "Present"
    };


    const result =
        await supabaseRequest(
            "/rest/v1/attendance",
            {
                method: "POST",

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


    if (
        !result ||
        result.length === 0
    ) {

        throw new Error(
            "Login attendance was not created."
        );
    }


    todayAttendance =
        result[0];
}


/* ==========================================
   UPDATE EXISTING RECORD WITH LOGIN
   ========================================== */

async function updateExistingLogin() {

    const loginTime =
        getCurrentTime();


    const result =
        await supabaseRequest(
            "/rest/v1/attendance?id=eq." +
            encodeURIComponent(
                todayAttendance.id
            ),
            {
                method: "PATCH",

                body:
                    JSON.stringify({

                        in_time:
                            loginTime,

                        attendance_status:
                            "Present"

                    })
            }
        );


    if (
        !result ||
        result.length === 0
    ) {

        throw new Error(
            "Unable to save login time."
        );
    }


    todayAttendance =
        result[0];
}


/* ==========================================
   EMPLOYEE LOGIN
   ========================================== */

async function employeeLogin() {

    clearMessage(
        "loginMessage"
    );

    const input =
        document.getElementById(
            "employeeCode"
        );

    const code =
        input.value.trim();


    if (!code) {

        showMessage(
            "loginMessage",
            "Please enter your employee code.",
            "error"
        );

        input.focus();

        return;
    }


    setLoginButton(
        true,
        "Checking..."
    );


    try {

        /*
        1. Find employee
        */

        const result =
            await findEmployee(
                code
            );


        if (
            !result ||
            result.length === 0
        ) {

            setLoginButton(
                false,
                "🟢 LOGIN"
            );

            showMessage(
                "loginMessage",
                "Employee code not found.",
                "error"
            );

            return;
        }


        currentEmployee =
            result[0];


        /*
        2. Find today's attendance
        */

        await loadTodayAttendance();


        /*
        3. No record:
           create today's login.
        */

        if (!todayAttendance) {

            await createLoginAttendance();

        }


        /*
        4. Record exists but
           IN TIME is empty:
           update it with current time.
        */

        else if (
            !todayAttendance.in_time
        ) {

            await updateExistingLogin();

        }


        /*
        5. Show employee screen.
        */

        document.getElementById(
            "loginCard"
        ).classList.add(
            "hidden"
        );

        document.getElementById(
            "attendanceCard"
        ).classList.remove(
            "hidden"
        );

        document.getElementById(
            "employeeName"
        ).textContent =
            currentEmployee.employee_name;


        updateAttendanceScreen();


    }
    catch (error) {

        console.error(
            "Employee login error:",
            error
        );

        setLoginButton(
            false,
            "🟢 LOGIN"
        );

        showMessage(
            "loginMessage",
            "Unable to login: " +
            error.message,
            "error"
        );
    }
}


/* ==========================================
   UPDATE ATTENDANCE SCREEN
   ========================================== */

function updateAttendanceScreen() {

    const loginTime =
        document.getElementById(
            "loginTime"
        );

    const logoutTime =
        document.getElementById(
            "logoutTime"
        );

    const hours =
        document.getElementById(
            "hoursCompleted"
        );


    if (!todayAttendance) {

        loginTime.textContent =
            "--";

        logoutTime.textContent =
            "--";

        hours.textContent =
            "--";

        setLogoutButton(
            true,
            "🔴 LOGOUT"
        );

        return;
    }


    loginTime.textContent =
        formatTime(
            todayAttendance.in_time
        );


    logoutTime.textContent =
        formatTime(
            todayAttendance.out_time
        );


    /*
    Already logged out
    */

    if (
        todayAttendance.out_time
    ) {

        hours.textContent =
            formatHours(
                todayAttendance.hours_completed
            );

        setLogoutButton(
            true,
            "✓ LOGOUT COMPLETED"
        );

        return;
    }


    /*
    Logged in but not logged out
    */

    hours.textContent =
        "In Progress";

    setLogoutButton(
        false,
        "🔴 LOGOUT"
    );
}


/* ==========================================
   EMPLOYEE LOGOUT
   ========================================== */

async function employeeLogout() {

    clearMessage(
        "attendanceMessage"
    );


    if (!todayAttendance) {

        showMessage(
            "attendanceMessage",
            "No login record found.",
            "error"
        );

        return;
    }


    if (
        todayAttendance.out_time
    ) {

        showMessage(
            "attendanceMessage",
            "You have already logged out.",
            "info"
        );

        updateAttendanceScreen();

        return;
    }


    if (
        !todayAttendance.in_time
    ) {

        showMessage(
            "attendanceMessage",
            "Login time is missing. Please contact the administrator.",
            "error"
        );

        return;
    }


    const confirmed =
        window.confirm(
            "Are you sure you want to logout?"
        );


    if (!confirmed) {
        return;
    }


    setLogoutButton(
        true,
        "Saving..."
    );


    try {

        const logoutTime =
            getCurrentTime();


        const completedHours =
            calculateHours(
                todayAttendance.in_time,
                logoutTime
            );


        const result =
            await supabaseRequest(
                "/rest/v1/attendance?id=eq." +
                encodeURIComponent(
                    todayAttendance.id
                ),
                {
                    method: "PATCH",

                    body:
                        JSON.stringify({

                            out_time:
                                logoutTime,

                            hours_completed:
                                Number(
                                    completedHours.toFixed(2)
                                ),

                            attendance_status:
                                "Present"

                        })
                }
            );


        if (
            !result ||
            result.length === 0
        ) {

            throw new Error(
                "Logout was not saved."
            );
        }


        todayAttendance =
            result[0];


        updateAttendanceScreen();


        showMessage(
            "attendanceMessage",
            "Logout recorded successfully. Hours completed: " +
            formatHours(
                completedHours
            ),
            "success"
        );


    }
    catch (error) {

        console.error(
            "Employee logout error:",
            error
        );

        setLogoutButton(
            false,
            "🔴 LOGOUT"
        );

        showMessage(
            "attendanceMessage",
            "Unable to record logout: " +
            error.message,
            "error"
        );
    }
}


/* ==========================================
   ENTER KEY
   ========================================== */

document
    .getElementById(
        "employeeCode"
    )
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                employeeLogin();

            }

        }
    );

</script>

</body>
</html>
